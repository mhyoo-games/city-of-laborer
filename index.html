<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2747">
<title>노동자의 도시</title>
<meta name="description" content="새벽 인력시장에서 하루를 시작하는 노동자의 하루살이 이야기">
<style>
  @font-face { font-family: Galmuri; src: url(assets/fonts/Galmuri11.woff2?__V__) format('woff2'); font-weight: normal; }
  @font-face { font-family: Galmuri; src: url(assets/fonts/Galmuri11-Bold.woff2?__V__) format('woff2'); font-weight: bold; }
  html, body { margin: 0; height: 100%; background: #1a1622; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { font-family: Galmuri, sans-serif; color: #fff4de; }
  #wrap { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; overflow: hidden; background: #000; }
  #game { position: absolute; left: 0; top: 0; width: 960px; height: 540px; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 14px; align-items: center; padding: 8px 14px; font-size: 17px;
    background: linear-gradient(#1a1622ee, #1a162200); pointer-events: none; text-shadow: 1px 1px 0 #3f2631; }
  #hud.off { display: none; }
  #hud .bar { display: inline-block; width: 70px; height: 10px; background: #3f2631; border: 2px solid #3f2631; vertical-align: middle; margin-left: 4px; }
  #hud .bar i { display: block; height: 100%; }
  #hud .money { margin-left: auto; font-weight: bold; color: #ffe08a; }
  #hud .goal .bar { width: 110px; }
  #ui { position: absolute; inset: 0; pointer-events: none; }
  .panel { position: absolute; pointer-events: auto; background: #fff4de; color: #3f2631; border: 4px solid #3f2631; border-radius: 10px;
    box-shadow: 0 6px 0 #00000055; padding: 16px 20px; font-size: 18px; line-height: 1.5; max-height: 470px; overflow-y: auto; box-sizing: border-box; }
  .panel.right { right: 20px; top: 52px; width: 470px; }
  .panel.bottom { left: 20px; right: 20px; bottom: 16px; }
  .panel.center { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 620px; }
  .panel.wide { left: 30px; right: 30px; top: 46px; bottom: 16px; max-height: none; }
  .panel h2 { margin: 0 0 6px; font-size: 24px; }
  .panel h3 { margin: 10px 0 4px; font-size: 19px; }
  .panel p { margin: 4px 0; }
  .say { background: #3f2631; color: #fff4de; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
  .say b { color: #ffe08a; }
  .muted { color: #8a6f72; font-size: 15px; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .opts.row { flex-direction: row; flex-wrap: wrap; }
  .opt { font: bold 18px Galmuri, sans-serif; text-align: left; background: #f6e2bc; color: #3f2631; border: 3px solid #3f2631; border-radius: 8px;
    padding: 7px 12px; cursor: pointer; box-shadow: 0 3px 0 #3f2631; }
  .opt small { display: block; font-weight: normal; font-size: 14px; color: #7a5a5e; }
  .opt.sel { background: #ffd06a; }
  .opt:disabled { opacity: .45; cursor: default; }
  .opt .tag { display: inline-block; font-size: 13px; padding: 0 6px; margin-left: 6px; border-radius: 4px; background: #3f2631; color: #ffe08a; vertical-align: middle; }
  .opt .tag.warn { background: #c8483a; color: #fff; }
  .grade { font-size: 64px; font-weight: bold; float: right; margin: -4px 4px 0 10px; }
  table.pay { width: 100%; border-collapse: collapse; font-size: 17px; }
  table.pay td { padding: 2px 4px; border-bottom: 1px dashed #c8b090; }
  table.pay td:last-child { text-align: right; }
  table.pay tr.sum td { font-weight: bold; font-size: 20px; border-bottom: none; border-top: 3px solid #3f2631; }
  .meter { display: inline-block; width: 120px; height: 12px; background: #e0c8a0; border: 2px solid #3f2631; vertical-align: middle; }
  .meter i { display: block; height: 100%; background: #e88a3a; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .tabs .opt { padding: 4px 10px; font-size: 16px; }
  .stamps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .stamp { border: 3px dashed #c8b090; border-radius: 10px; padding: 6px; text-align: center; font-size: 14px; min-height: 64px; }
  .stamp.on { border: 3px solid #c8483a; color: #c8483a; background: #fff0e8; }
  .stamp b { display: block; font-size: 16px; }
  input.name { font: 20px Galmuri, sans-serif; padding: 6px 10px; border: 3px solid #3f2631; border-radius: 8px; width: 200px; background: #fffaf0; color: #3f2631; }
  .logo { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 64px; font-weight: bold; text-shadow: 4px 4px 0 #3f2631, -2px -2px 0 #3f2631; color: #ffd06a; pointer-events: none; }
  .logo small { display: block; font-size: 20px; color: #fff4de; margin-top: 6px; }
  .toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); background: #c8483a; color: #fff; border: 3px solid #3f2631; border-radius: 8px; padding: 6px 16px; font-size: 18px; font-weight: bold; pointer-events: none; animation: pop 2.6s forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  /* 세로 휴대폰 */
  body.portrait #hud { position: fixed; top: 0; left: 0; right: 0; font-size: 13px; gap: 8px; padding: 6px 8px; background: #1a1622; flex-wrap: wrap; }
  body.portrait #hud .bar { width: 34px; height: 8px; }
  body.portrait #hud .goal .bar { width: 44px; }
  body.portrait #ui { position: fixed; left: 0; right: 0; bottom: 0; overflow-y: auto; pointer-events: auto; background: #1a1622; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  body.portrait .panel { position: static; transform: none; width: auto; max-height: none; font-size: 16px; padding: 12px 14px; }
  body.portrait .panel h2 { font-size: 20px; }
  body.portrait .opt { font-size: 16px; }
  body.portrait .logo { position: static; font-size: 40px; padding: 10px 0 16px; }
  body.portrait .stamps { grid-template-columns: repeat(3, 1fr); }
  body.portrait[data-screen=work] #ui { display: none; }
  #pad { display: none; position: fixed; left: 0; right: 0; bottom: 0; justify-content: space-between; align-items: flex-end; pointer-events: none;
    padding: 0 calc(16px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  body.touch[data-screen=work] #pad { display: flex; }
  #pad .grp { display: grid; gap: 6px; pointer-events: none; }
  #pad .dir { grid-template-columns: 62px 62px 62px; grid-template-rows: 62px 62px; }
  #pad .act { grid-auto-flow: column; align-items: end; }
  #pad button { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 3px solid #3f2631; background: rgba(255,244,222,.35);
    color: #fff4de; font: bold 17px Galmuri, sans-serif; text-shadow: 1px 1px 0 #3f2631; touch-action: none; padding: 0; }
  #pad button.on { background: rgba(255,208,106,.7); }
  #pad .big { width: 80px; height: 80px; }
  #pad [data-k=U] { grid-column: 2; } #pad [data-k=L] { grid-column: 1; grid-row: 2; } #pad [data-k=D] { grid-column: 2; grid-row: 2; } #pad [data-k=R] { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180"></canvas>
  <div id="hud" class="off"></div>
  <div id="ui"></div>
</div>
<div id="pad">
  <div class="grp dir">
    <button data-k="U">▲</button><button data-k="L">◀</button><button data-k="D">▼</button><button data-k="R">▶</button>
  </div>
  <div class="grp act">
    <button data-k="B">X</button><button class="big" data-k="A">Z</button>
  </div>
</div>
<script type="module" src="main.js?__V__"></script>
</body>
</html>
